<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy network replay</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#233d34;background:#f6f5ef;font:14px system-ui,sans-serif}.shell{border:1px solid #d9dfd5;border-radius:16px;background:#fffef9;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #e4e7dd}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#62736b}.top strong{font-size:17px}.pill{font-size:11px;background:#e7efe5;border-radius:20px;padding:5px 9px}.scene{display:grid;grid-template-columns:minmax(0,1fr) 220px}.graph{position:relative;padding:8px}.graph svg{display:block;width:100%;height:auto}.node{cursor:pointer}.node:focus{outline:none}.node:focus circle{stroke:#8455a5;stroke-width:4}.node text{pointer-events:none}.node circle{stroke:#d2ddd1;stroke-width:2;fill:#f1f5ec}.node.active circle{stroke:#8455a5;stroke-width:4}.node .name{font-size:18px;font-weight:700;fill:#233d34}.node .role{font-size:12px;fill:#65746b}.node .reading{font-size:12px;fill:#27634c}.trade{fill:none;stroke-width:3;opacity:.55;cursor:pointer}.trade.selected{stroke-width:5;opacity:1}.message{fill:none;stroke:#8c53aa;stroke-width:3;stroke-dasharray:7 5;animation:flow .7s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.message{animation:none}}aside{padding:16px 12px;border-left:1px solid #e4e7dd;max-height:410px;overflow:auto}aside h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:#62736b}.tradecard{display:block;width:100%;text-align:left;border:1px solid #e0e4d9;background:#fafbf6;border-radius:9px;padding:10px;margin:0 0 7px;color:inherit;cursor:pointer}.tradecard.selected{border-color:#27634c;background:#eaf1e5}.tradecard span{display:block;color:#607166;font-size:12px;margin-top:3px}.empty{font-size:13px;line-height:1.6;color:#778277}.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 18px 12px;font-size:11px;color:#62736b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.message-dot{background:#8c53aa}.candidate-dot{background:#aeb9b0}.committed-dot{background:#c18a30}.settled-dot{background:#2d7f62}.event{padding:13px 18px;background:#edf2e7;min-height:88px}.event strong{font-size:15px}.event p{margin:5px 0 0;font-size:13px;line-height:1.45}.progress{display:flex;gap:8px;padding:12px 18px;align-items:center}.progress input{flex:1;min-width:40px;accent-color:#27634c}.progress button{background:#fffef9;color:#233d34;border:1px solid #ccd7c9;padding:8px 12px;border-radius:7px;cursor:pointer}.progress #play{background:#27634c;color:#fff;border-color:#27634c;min-width:78px}.progress button:disabled{opacity:.45;cursor:default}.phasebar{display:flex;justify-content:space-between;gap:4px;padding:0 16px 12px}.phasebar button{border:0;background:none;font-size:12px;padding:6px 4px;color:#768477;cursor:pointer}.phasebar button[aria-current=true]{color:#27634c;font-weight:700;border-bottom:2px solid #27634c}.metrics{display:flex;gap:18px;padding:12px 18px;border-top:1px solid #e4e7dd;font-size:12px}.metrics b{font-size:16px;margin-right:4px}.foot{margin:8px 2px 0;color:#6d796e;font-size:11px}.counter{font-size:11px;white-space:nowrap}@media(max-width:760px){.scene{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #e4e7dd;max-height:138px;display:flex;gap:8px;align-items:flex-start}aside h3{display:none}.tradecard{min-width:150px;margin:0}.graph{padding:0}.metrics{gap:12px;flex-wrap:wrap}.phasebar button{font-size:11px}.progress{padding:10px}.top{padding:12px}.pill{max-width:130px;text-align:center}}
</style>
<div class="shell"><div class="top"><div><div class="eyebrow">The exchange network</div><strong id="phase">Observe</strong></div><span class="pill" id="mode">Recorded simulation replay</span></div>
<div class="scene"><div class="graph"><svg viewBox="0 0 800 460" role="img" aria-label="Logical network of three sellers, three buyers, market, utility and meter"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c53aa"/></marker></defs><g id="routes"></g><g id="edges"></g><g id="messages"></g><g id="nodes"></g></svg></div><aside id="trades" aria-label="Trades at the selected event"></aside></div>
<div class="legend"><span><i class="dot message-dot"></i>Message</span><span><i class="dot candidate-dot"></i>Candidate</span><span><i class="dot committed-dot"></i>Committed / pending</span><span><i class="dot settled-dot"></i>Settled</span></div>
<div class="event" aria-live="polite"><strong id="headline"></strong><p id="note"></p></div>
<div class="progress"><button id="back" aria-label="Previous event">←</button><button id="play">▶ Play</button><button id="next" aria-label="Next event">→</button><input id="position" type="range" min="0" value="0" aria-label="Replay position"><span class="counter" id="counter"></span></div>
<div class="phasebar" id="phases" aria-label="Jump to stage"></div><div class="metrics"><span><b id="committed">0.00</b>kWh committed</span><span><b id="settled">0.00</b>kWh settled</span><span><b id="paid">0.00</b>INR paid</span></div></div>
<p class="foot">Click a node to inspect its rules. Logical connections, not physical power lines. Play replays a completed run; it does not run a new simulation.</p>
<script>
const replay=__REPLAY_DATA__;
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const phases=['Observe','Propose','Validate','Commit','Meter','Settle'];
const nodes={S1:[115,100,'Solar seller'],S2:[115,230,'Solar seller'],S3:[115,360,'Solar seller'],B1:[685,100,'Energy buyer'],B2:[685,230,'Energy buyer'],B3:[685,360,'Energy buyer'],market:[400,230,'Matching'],utility:[400,65,'Trading cap'],meter:[400,400,'Actual readings']};
let position=0,timer=null,selected=null,selectedNode=null;
function el(tag,attrs,parent,text){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;parent.append(n);return n;}
for(const [name,[x,y,role]] of Object.entries(nodes)){const g=el('g',{class:'node',role:'button',tabindex:'0','aria-label':'Inspect '+name,id:'node-'+name,transform:`translate(${x},${y})`},$('nodes'));g.onclick=()=>{selectedNode=selectedNode===name?null:name;show(position);};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.onclick();}};el('circle',{r:name.length===2?36:43},g);el('text',{class:'name','text-anchor':'middle',y:5},g,name.length===2?name:name[0].toUpperCase()+name.slice(1));el('text',{class:'role','text-anchor':'middle',y:57},g,role);el('text',{class:'reading','text-anchor':'middle',y:73},g,'');}
for(const [name,[x,y]] of Object.entries(nodes)){if(name!=='market')el('line',{x1:x,y1:y,x2:400,y2:230,stroke:'#e9ede4','stroke-width':1},$('routes'));}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Play';}
function show(index){position=Math.max(0,Math.min(index,replay.frames.length-1));const frame=replay.frames[position];$('phase').textContent=frame.phase;$('headline').textContent=frame.title;$('note').textContent=frame.note;$('position').value=position;$('counter').textContent=`${position+1} / ${replay.frames.length}`;for(const key of ['committed','settled','paid'])$(key).textContent=frame[key].toFixed(2);
$('back').disabled=position===0;$('next').disabled=position===replay.frames.length-1;$('edges').replaceChildren();$('messages').replaceChildren();$('trades').replaceChildren();
for(const [name] of Object.entries(nodes)){const n=$('node-'+name);n.classList.toggle('active',name===frame.source||name===frame.target||name===selectedNode);const r=frame.readings[name];n.querySelector('.reading').textContent=r?(r.kwh===null?'Reading missing':r.kwh.toFixed(2)+' kWh measured'):'';}
const title=document.createElement('h3');title.textContent='Trades at this point';$('trades').append(title);
if(selectedNode){const p=replay.policies[selectedNode],info=document.createElement('p');info.className='empty';let copy='Run a scenario to inspect this household’s policy.';if(p)copy=p.role==='seller'?`Offer = max(0, ${p.forecast_surplus.toFixed(2)} forecast − ${p.reserve.toFixed(2)} reserve) kWh. Minimum INR ${p.min_price.toFixed(2)}/kWh.`:`Demand ${p.demand.toFixed(2)} kWh. Accept only up to INR ${p.max_price.toFixed(2)}/kWh and within the INR ${p.budget.toFixed(2)} budget.`;else if(selectedNode==='market')copy='Matches compatible offers at midpoint prices; commits after utility approval and buyer reservations.';else if(selectedNode==='utility')copy=replay.utility_cap===null?'Checks the aggregate trading cap.':`Allows up to ${replay.utility_cap.toFixed(2)} kWh of commitments. No electrical power-flow calculation.`;else if(selectedNode==='meter')copy='Reveals actual import/export only after commitment. Missing readings cannot support settlement.';info.textContent=selectedNode+' · '+copy;$('trades').append(info);}
if(!frame.trades.length&&!selectedNode){const empty=document.createElement('p');empty.className='empty';empty.textContent=replay.run_id?'No matches yet. Watch households submit their offers and bids.':'Six households. One market. Choose a scenario, then run it.';$('trades').append(empty);}
for(const [i,t] of frame.trades.entries()){const a=nodes[t.seller],b=nodes[t.buyer], settled=!['candidate','approved','committed','pending'].includes(t.status),color=t.status==='cancelled'?'#aeb9b0':settled&&t.settled_kwh<t.committed_kwh?'#c18a30':settled?'#2d7f62':['candidate','approved'].includes(t.status)?'#aeb9b0':'#c18a30';const path=el('path',{d:`M${a[0]+38},${a[1]} C330,${a[1]+(i-2)*12} 470,${b[1]+(i-2)*12} ${b[0]-38},${b[1]}`,class:'trade'+(selected===t.id?' selected':''),stroke:color,'stroke-dasharray':['candidate','approved','pending','cancelled'].includes(t.status)?'6 5':'none'},$('edges'));el('title',{},path,`${t.seller} → ${t.buyer}: ${t.committed_kwh.toFixed(2)} kWh at INR ${t.price.toFixed(2)}/kWh · ${t.status}`);path.onclick=()=>{selected=t.id;show(position);};const card=document.createElement('button');card.className='tradecard'+(selected===t.id?' selected':'');card.textContent=`${t.seller} → ${t.buyer}`;const amount=document.createElement('span');amount.textContent=`${settled?t.settled_kwh.toFixed(2)+' / ':''}${t.committed_kwh.toFixed(2)} kWh · INR ${t.price.toFixed(2)}/kWh`;const status=document.createElement('span');status.textContent=t.status+(t.status==='settled'&&t.settled_kwh<t.committed_kwh?' · shortfall':'');card.append(amount,status);card.onclick=()=>{selected=selected===t.id?null:t.id;show(position);};$('trades').append(card);}
if(nodes[frame.source]&&nodes[frame.target]){const a=nodes[frame.source],b=nodes[frame.target],dist=Math.hypot(b[0]-a[0],b[1]-a[1]),dx=(b[0]-a[0])/dist,dy=(b[1]-a[1])/dist;el('path',{d:`M${a[0]+dx*45},${a[1]+dy*45} L${b[0]-dx*47},${b[1]-dy*47}`,class:'message','marker-end':'url(#arrow)'},$('messages'));}
[...$('phases').children].forEach(b=>b.setAttribute('aria-current',b.textContent===frame.phase));if(position===replay.frames.length-1)stop();}
for(const phase of phases){const b=document.createElement('button');b.textContent=phase;b.disabled=!replay.frames.some(f=>f.phase===phase);b.onclick=()=>{stop();show(replay.frames.findIndex(f=>f.phase===phase));};$('phases').append(b);}
$('position').max=replay.frames.length-1;$('position').oninput=e=>{stop();show(Number(e.target.value));};$('back').onclick=()=>{stop();show(position-1);};$('next').onclick=()=>{stop();show(position+1);};$('play').disabled=!replay.run_id;$('mode').textContent=replay.run_id?'Verified run · replay':'Network preview';$('play').onclick=()=>{if(timer){stop();return;}if(position===replay.frames.length-1)show(0);$('play').textContent='Ⅱ Pause';timer=setInterval(()=>show(position+1),700);};show(0);
</script></html>
